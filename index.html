<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning Arcade</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #87CEEB;
        }
        #game-card {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #87CEEB;
            transition: background 0.3s ease;
        }
        
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1.title {
            color: #FF5722;
            font-size: min(3rem, 6vh);
            font-weight: 800;
            text-align: center;
            margin-bottom: 3vh;
            text-shadow: 2px 2px 0px #FFF, -2px -2px 0px #FFF, 2px -2px 0px #FFF, -2px 2px 0px #FFF;
        }

        .btn-panel {
            background: #FFFFFF;
            border: 4px solid #FF9600;
            border-radius: 20px;
            width: min(420px, 85vw);
            height: min(70px, 9vh);
            margin: 1.2vh 0;
            font-size: min(1.35rem, 3.5vh);
            font-weight: 700;
            color: #323232;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }
        .btn-panel:hover {
            background: #FFF0D2;
            transform: translateY(-2px) scale(1.02);
        }

        .btn-back {
            position: absolute;
            bottom: 4vh;
            width: min(220px, 50vw);
            height: min(55px, 7vh);
            border-radius: 15px;
            font-size: min(1.2rem, 3vh);
        }

        .btn-globe {
            position: absolute;
            bottom: 4vh;
            right: 4vw;
            width: min(160px, 35vw);
            height: min(50px, 6.5vh);
            border-radius: 15px;
            border-width: 3px;
            font-size: min(1.1rem, 2.8vh);
            background: #FFFFFF;
            cursor: pointer;
        }

        .hud-score {
            position: absolute;
            top: 3vh; left: 4vw;
            background: #FFF;
            border: 3px solid #FF5722;
            border-radius: 15px;
            padding: 8px 20px;
            font-size: min(1.5rem, 3.5vh);
            font-weight: 800;
            color: #FF5722;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .hud-bottom-left {
            position: absolute;
            bottom: 4vh; left: 4vw;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .btn-action {
            width: min(160px, 38vw);
            height: min(50px, 6.5vh);
            border-radius: 15px;
            font-size: min(1.1rem, 2.8vh);
            font-weight: 700;
            cursor: pointer;
        }
        .btn-finish { background: #FFF; border: 3px solid #F44336; color: #F44336; }
        .btn-finish:hover { background: #FFE6E6; }
        .btn-skip { background: #FFF; border: 3px solid #FF9600; color: #323232; }
        .btn-skip:hover { background: #FFF0D2; }

        .question-box {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 25px;
            width: 85vw;
            max-width: 900px;
            min-height: min(160px, 22vh);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: min(2.2rem, 4vh);
            font-weight: 800;
            color: #323232;
            margin-bottom: 3vh;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            width: min(550px, 85vw);
        }

        .choice-btn {
            background: #FFF;
            border: 4px solid #FF9600;
            border-radius: 20px;
            height: min(60px, 8vh);
            font-size: min(1.5rem, 3.2vh);
            font-weight: 700;
            color: #323232;
            cursor: pointer;
            transition: all 0.2s;
        }
        .choice-btn:hover { background: #FFF0D2; transform: scale(1.02); }

        .feedback-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .feedback-overlay.hidden { display: none; }
        .smiley-icon {
            font-size: min(8rem, 18vh);
            margin-bottom: 2vh;
            animation: bounce 0.6s infinite alternate;
        }
        .feedback-msg {
            font-size: min(2.5rem, 5vh);
            font-weight: 800;
            text-align: center;
            padding: 0 20px;
        }
        .feedback-correct { color: #4CAF50; }
        .feedback-wrong { color: #F44336; }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        .reading-card {
            background: rgba(255, 255, 255, 0.92);
            width: 85vw;
            max-width: 900px;
            height: 55vh;
            border-radius: 20px;
            padding: 30px;
            font-size: min(1.6rem, 3vh);
            line-height: min(2.5rem, 4.5vh);
            color: #323232;

            overflow-y: auto;

        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex !important; }
        input[type="file"] { display: none; }
    </style>
</head>

const PRESET_STORIES = [
    { name: "Le Petit Lapin (FR)", lang: "fr", text: "Un petit lapin blanc habite dans la forêt. Il aime manger des carottes fraîches. Un jour, il rencontre un papillon bleu. Le papillon vole près de la rivière. Le lapin suit son nouvel ami toute la journée." },

    { name: "الولد والعصفور (AR)", lang: "ar", text: "طارق ولد صغير. طارق يحب اللعب في الحديقة. في يوم من الأيام، رأى طارق عصفورا جميلا. العصفور يغني فوق الشجرة الكبيرة. أعطى طارق العصفور بعض الخبز. طارق والعصفور أصدقاء الآن." }
];

let CURRENT_LANG = 'fr';
let CURRENT_THEME = 'CIEL';
let questions = [];
let currentQIndex = 0;
let score = 0;
let isAnswering = false;

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function makeDistractorsNum(ans) {
    let choices = new Set([ans.toString()]);
    while (choices.size < 4) {
        let fake = ans + [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 10, -10][randInt(0, 11)];
        if (fake >= 0) choices.add(fake.toString());
    }
    return Array.from(choices).sort(() => Math.random() - 0.5);
}

function makeDistractorsDouble(v1, v2) {
    let correct = `${v1} , ${v2}`;
    let choices = new Set([correct]);
    while (choices.size < 4) {
        let f1 = Math.max(0, v1 + [-5, -2, 2, 5, 10, -10][randInt(0, 5)]);
        let f2 = Math.max(0, v2 + [-5, -2, 2, 5, 10, -10][randInt(0, 5)]);
        choices.add(`${f1} , ${f2}`);
    }
    return Array.from(choices).sort(() => Math.random() - 0.5);
}

function generateMathQuestionsByAge(age) {
    let list = [];
    for (let i = 0; i < 8; i++) {
        if (age === "6-8") {
            let op = Math.random() > 0.5 ? '+' : '-';
            let a, b, ans;
            if (op === '+') { a = randInt(1, 15); b = randInt(1, 15); ans = a + b; }
            else { a = randInt(5, 20); b = randInt(1, a); ans = a - b; }
            list.push({ type: "fill_blank", question: `${a} ${op} ${b} = ?`, answer: ans.toString(), choices: makeDistractorsNum(ans) });
        } else if (age === "8-10") {
            if (Math.random() > 0.5) {
                let op = ['+', '-', '*'][randInt(0, 2)];
                let a, b, ans;
                if (op === '*') { a = randInt(2, 9); b = randInt(2, 9); ans = a * b; }
                else if (op === '+') { a = randInt(10, 50); b = randInt(10, 50); ans = a + b; }
                else { a = randInt(20, 80); b = randInt(5, a); ans = a - b; }
                list.push({ type: "fill_blank", question: `${a} ${op === '*' ? 'x' : op} ${b} = ?`, answer: ans.toString(), choices: makeDistractorsNum(ans) });
            } else {
                let start = randInt(5, 20), step = [2, 5, 10][randInt(0, 2)];
                let v1 = start + 3 * step, v2 = start + 4 * step;
                list.push({ type: "fill_blank", question: `Suite : ${start} - ${start+step} - ${start+2*step} - ? - ? - ${start+5*step}`, answer: `${v1} , ${v2}`, choices: makeDistractorsDouble(v1, v2) });
            }
        } else {
            if (Math.random() > 0.5) {
                let ans = randInt(2, 12), b = randInt(5, 30), a = ans * b;
                list.push({ type: "fill_blank", question: `? x ${b} = ${a}`, answer: ans.toString(), choices: makeDistractorsNum(ans) });
            } else {
                let a = randInt(2, 5), b = randInt(2, 5), c = randInt(5, 20);
                let ans = (a * b) + c;
                list.push({ type: "fill_blank", question: `(${a} x ${b}) + ${c} = ?`, answer: ans.toString(), choices: makeDistractorsNum(ans) });
            }
        }
    }
    return list;
}

function parseCustomMathText(text) {
    let list = [];
    let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

    lines.forEach(line => {
        let calc = [...line.matchAll(/(\d+)\s*([\+\-\*\/xX])\s*(\d+)\s*=\s*(?:_{2,}|\?)?/g)];
        calc.forEach(m => {
            let a = parseInt(m[1]), op = m[2], b = parseInt(m[3]), ans;
            if (op === '+') ans = a + b;
            else if (op === '-') ans = a - b;
            else if (['*', 'x', 'X'].includes(op)) ans = a * b;
            else if (op === '/' && b !== 0) ans = Math.floor(a / b);
            if (ans !== undefined) list.push({ type: "fill_blank", question: `${a} ${op === '*' ? 'x' : op} ${b} = ?`, answer: ans.toString(), choices: makeDistractorsNum(ans) });
        });

        let comp = [...line.matchAll(/(\d+)\s*_{2,}\s*(\d+)/g)];
        comp.forEach(m => {
            let n1 = parseInt(m[1]), n2 = parseInt(m[2]);
            let ans = n1 === n2 ? "=" : (n1 < n2 ? "<" : ">");
            list.push({ type: "fill_blank", question: `Compare : ${n1}  [ ? ]  ${n2}`, answer: ans, choices: ["<", ">", "="].sort(() => Math.random() - 0.5) });
        });

        if ((line.includes('-') || line.includes('_')) && /\d/.test(line) && !line.includes("Exercice")) {
            let parts = line.replace(/____/g, '?').split(/[\s\-]+/);
            let elems = parts.filter(p => /^\d+$/.test(p) || p === '?');
            let gapCount = elems.filter(p => p === '?').length;

            if (elems.length >= 4 && gapCount >= 1) {
                let nums = [];
                elems.forEach((val, idx) => { if (/^\d+$/.test(val)) nums.push({ idx, val: parseInt(val) }); });
                if (nums.length >= 2) {
                    let step = Math.floor((nums[1].val - nums[0].val) / (nums[1].idx - nums[0].idx));
                    let gapIndices = [];
                    elems.forEach((val, idx) => { if (val === '?') gapIndices.push(idx); });

                    if (gapIndices.length === 1) {
                        let ans = nums[0].val + (gapIndices[0] - nums[0].idx) * step;
                        list.push({ type: "fill_blank", question: "Suite : " + elems.join(" - "), answer: ans.toString(), choices: makeDistractorsNum(ans) });
                    } else if (gapIndices.length >= 2) {
                        let ans1 = nums[0].val + (gapIndices[0] - nums[0].idx) * step;
                        let ans2 = nums[0].val + (gapIndices[1] - nums[0].idx) * step;
                        list.push({ type: "fill_blank", question: "Suite : " + elems.slice(0, 6).join(" - "), answer: `${ans1} , ${ans2}`, choices: makeDistractorsDouble(ans1, ans2) });
                    }
                }
            }
        }
    });
    return list;
}

function generateSmartQuestionsFromText(text) {
    let parsedMath = parseCustomMathText(text);
    if (parsedMath.length > 0) return parsedMath;

    let list = [];
    let sentences = text.replace(/[!?؟]/g, '.').split('.').map(s => s.trim()).filter(s => s.length > 8);
    let allWords = text.split(/\s+/).filter(w => w.length > 3);

    sentences.forEach(sentence => {
        let words = sentence.split(' ');
        if (words.length >= 4) {
            let targetWord = words[randInt(0, words.length - 1)];
            let qText = sentence.replace(targetWord, "_____");
            let choices = [targetWord];
            while (choices.length < 3 && allWords.length > 3) {
                let w = allWords[randInt(0, allWords.length - 1)];
                if (!choices.includes(w)) choices.push(w);
            }
            list.push({ type: "fill_blank", question: qText, answer: targetWord, choices: choices.sort(() => Math.random() - 0.5) });
        }
    });
    return list;
}

const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let cloudPos = [
    {x: 0.05, y: 60, speed: 0.0004}, {x: 0.35, y: 140, speed: 0.0006},
    {x: 0.70, y: 80, speed: 0.0005}, {x: 0.20, y: 300, speed: 0.0003},
    {x: 0.55, y: 450, speed: 0.0007}, {x: 0.85, y: 350, speed: 0.0005}
];
let starPos = Array.from({length: 100}, () => ({x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight}));

function drawCloud(x, y) {
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.arc(x, y, 35, 0, Math.PI * 2);
    ctx.arc(x + 40, y - 25, 45, 0, Math.PI * 2);
    ctx.arc(x + 80, y, 35, 0, Math.PI * 2);
    ctx.fillRect(x, y - 10, 80, 45);
    ctx.fill();
}

function renderCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let time = Date.now() * 0.003;

    if (CURRENT_THEME === 'CIEL' || CURRENT_THEME === 'MER' || CURRENT_THEME === 'FLEUR') {
        ctx.fillStyle = "#FFD700";
        ctx.beginPath(); ctx.arc(canvas.width - 100, 100, 70 + Math.sin(time) * 5, 0, Math.PI * 2); ctx.fill();

        cloudPos.forEach(c => {
            c.x += c.speed;
            if (c.x > 1.1) c.x = -0.15;
            drawCloud(c.x * canvas.width, c.y);
        });

        if (CURRENT_THEME === 'MER') {
            ctx.fillStyle = "#1E90FF";
            ctx.fillRect(0, canvas.height - 180, canvas.width, 180);
            for (let x = 0; x < canvas.width; x += 40) {
                let waveY = canvas.height - 180 + Math.sin((Date.now() * 0.005) + (x * 0.02)) * 10;
                ctx.fillStyle = "#006994";
                ctx.beginPath(); ctx.arc(x, waveY, 25, 0, Math.PI*2); ctx.fill();
            }
        } else if (CURRENT_THEME === 'FLEUR') {
            ctx.fillStyle = "#98FB98";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            let fColors = ["#FF69B4", "#DDA0DD", "#FFC0CB"];
            let idx = 0;
            for (let x = 80; x < canvas.width; x += 180) {
                let y = canvas.height - 55 + Math.sin(time + idx) * 5;
                let c = fColors[idx % 3];
                ctx.fillStyle = c;
                for (let a = 0; a < 360; a += 60) {
                    let rad = a * Math.PI / 180;
                    ctx.beginPath(); ctx.arc(x + 12*Math.cos(rad), y + 12*Math.sin(rad), 8, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle = "#FFD700";
                ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI*2); ctx.fill();
                idx++;
            }
        }
    } else if (CURRENT_THEME === 'FORET') {
        cloudPos.slice(0, 3).forEach(c => {
            c.x += c.speed;
            if (c.x > 1.1) c.x = -0.15;
            drawCloud(c.x * canvas.width, c.y);
        });
        ctx.fillStyle = "#228B22";
        ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
        for (let x = 60; x < canvas.width + 60; x += 130) {
            ctx.fillStyle = "#654321"; ctx.fillRect(x - 12, canvas.height - 90, 24, 50);
            ctx.fillStyle = "#228B22"; ctx.beginPath(); ctx.arc(x, canvas.height - 100, 38, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#2E8B57"; ctx.beginPath(); ctx.arc(x - 20, canvas.height - 90, 28, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 20, canvas.height - 90, 28, 0, Math.PI*2); ctx.fill();
        }
    } else if (CURRENT_THEME === 'ESPACE') {
        ctx.fillStyle = "#FFFFFF";
        starPos.forEach(s => {
            let r = Math.max(1, Math.sin(time + s.x) * 2 + 3);
            ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.fill();
        });
        ctx.fillStyle = "#F0F0FF"; ctx.beginPath(); ctx.arc(canvas.width - 120, 110, 60, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#0F0F23"; ctx.beginPath(); ctx.arc(canvas.width - 145, 95, 50, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(renderCanvas);
}
renderCanvas();

function toggleLanguage() {
    if (CURRENT_LANG === 'fr') CURRENT_LANG = 'en';
    else if (CURRENT_LANG === 'en') CURRENT_LANG = 'ar';
    else CURRENT_LANG = 'fr';
    updateUI();
}

function navigateTo(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    document.getElementById('globe-btn').style.display = (screenId === 'screen-playing') ? 'none' : 'flex';
}

function setTheme(theme) {
    CURRENT_THEME = theme;
    let card = document.getElementById('game-card');
    if (theme === 'CIEL') card.style.background = '#87CEEB';
    else if (theme === 'MER') card.style.background = '#AFEEEE';
    else if (theme === 'FORET') card.style.background = '#98FB98';
    else if (theme === 'FLEUR') card.style.background = '#AFEEEE';
    else if (theme === 'ESPACE') card.style.background = '#0F0F23';
    navigateTo('screen-main');
}

function startAgeMath(age) {
    questions = generateMathQuestionsByAge(age);
    currentQIndex = 0; score = 0;
    showQuestion();
    navigateTo('screen-playing');
}

function startPresetStory(idx) {
    let s = PRESET_STORIES[idx];
    CURRENT_LANG = s.lang;
    updateUI();
    document.getElementById('reading-text-card').innerText = s.text;
    questions = generateSmartQuestionsFromText(s.text);
    navigateTo('screen-reading');
}

function finishReading() {
    currentQIndex = 0; score = 0;
    showQuestion();
    navigateTo('screen-playing');
}

function showQuestion() {
    if (currentQIndex >= questions.length) { finishGame(); return; }

    let q = questions[currentQIndex];
    let ui = UI_TEXT[CURRENT_LANG];
    document.getElementById('score-val').innerText = `${ui.score}${score}`;
    document.getElementById('game-q-title').innerText = q.question.includes('=') || q.question.includes('?') ? ui.math_title : ui.fill;
    document.getElementById('question-text').innerText = q.question;

    let box = document.getElementById('answers-box');
    box.innerHTML = '';
    
    q.choices.forEach(c => {
        let btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = c;
        btn.onclick = () => handleAnswer(c === q.answer);
        box.appendChild(btn);
    });
}

function handleAnswer(isCorrect) {
    if (isAnswering) return;
    isAnswering = true;

    let ui = UI_TEXT[CURRENT_LANG];
    let panel = document.getElementById('feedback-panel');
    let smiley = document.getElementById('feedback-smiley');
    let txt = document.getElementById('feedback-text');

    if (isCorrect) {
        score += 100;
        smiley.innerText = "😊";
        txt.innerText = ui.excellent;
        txt.className = "feedback-msg feedback-correct";
    } else {
        smiley.innerText = "😞";
        txt.innerText = ui.nope + questions[currentQIndex].answer;
        txt.className = "feedback-msg feedback-wrong";
    }

    panel.classList.remove('hidden');

    setTimeout(() => {
        panel.classList.add('hidden');
        currentQIndex++;
        isAnswering = false;
        showQuestion();
    }, 1500);
}

function skipQuestion() { 
    if (isAnswering) return;
    currentQIndex++; 
    showQuestion(); 
}

function finishGame() {
    let ui = UI_TEXT[CURRENT_LANG];
    document.getElementById('txt-final-msg').innerText = score >= (questions.length * 40) ? ui.win_end : ui.lose_end;
    document.getElementById('txt-final-score').innerText = `${ui.final_score}${score}`;
    navigateTo('screen-finished');
}

function restartGame() {
    currentQIndex = 0; score = 0;
    questions.sort(() => Math.random() - 0.5);
    showQuestion();
    navigateTo('screen-playing');
}

function triggerFileInput() { document.getElementById('file-selector').click(); }

document.getElementById('file-selector').addEventListener('change', function(e) {
    let file = e.target.files[0];
    if (!file) return;

    let fname = file.name.toLowerCase();
    if (fname.endsWith('.pdf') && typeof pdfjsLib !== 'undefined') {
        let reader = new FileReader();
        reader.onload = function() {
            let typedarray = new Uint8Array(this.result);
            pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                let maxPages = pdf.numPages, countPromises = [];
                for (let j = 1; j <= maxPages; j++) {
                    countPromises.push(pdf.getPage(j).then(page => page.getTextContent().then(t => t.items.map(s => s.str).join(' '))));
                }
                Promise.all(countPromises).then(texts => {
                    let fullText = texts.join('\n');
                    questions = generateSmartQuestionsFromText(fullText);
                    currentQIndex = 0; score = 0;
                    showQuestion();
                    navigateTo('screen-playing');
                });
            });
        };
        reader.readAsArrayBuffer(file);
    } else if (fname.endsWith('.docx') && typeof mammoth !== 'undefined') {
        let reader = new FileReader();
        reader.onload = function(e) {
            mammoth.extractRawText({arrayBuffer: e.target.result}).then(result => {
                questions = generateSmartQuestionsFromText(result.value);
                currentQIndex = 0; score = 0;
                showQuestion();
                navigateTo('screen-playing');
            });
        };
        reader.readAsArrayBuffer(file);
    } else {
        let reader = new FileReader();
        reader.onload = function(e) {
            let fullText = e.target.result;
            questions = generateSmartQuestionsFromText(fullText);
            currentQIndex = 0; score = 0;
            showQuestion();
            navigateTo('screen-playing');
        };
        reader.readAsText(file);
    }
});

updateUI();
